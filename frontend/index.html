<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#E31E24" />
    <title>Korzinka Dostavka</title>
    <!-- Visual Crash Logger for iOS WebView debugging -->
    <script>
      window.__logErrors = [];
      function showCrashBanner(msg, src, lineno) {
        var el = document.getElementById('debug-crash-banner');
        if (!el) {
          el = document.createElement('div');
          el.id = 'debug-crash-banner';
          el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#b91c1c;color:#fff;padding:12px;font-family:sans-serif;font-size:12px;max-height:40vh;overflow:auto;word-break:break-all;box-shadow:0 4px 6px rgba(0,0,0,0.3);';
          document.body ? document.body.appendChild(el) : document.documentElement.appendChild(el);
        }
        var item = document.createElement('div');
        item.style.marginBottom = '6px';
        item.innerHTML = '<b>[JS Error]:</b> ' + msg + (src ? ('<br><small>' + src + ':' + lineno + '</small>') : '');
        el.appendChild(item);
      }
      window.onerror = function(msg, src, lineno, colno, error) {
        showCrashBanner(msg, src, lineno);
        return false;
      };
      window.onunhandledrejection = function(e) {
        showCrashBanner('Unhandled Rejection: ' + (e.reason ? (e.reason.message || e.reason) : 'Unknown promise rejection'));
      };
    </script>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      } catch (e) {
        console.warn("Early Telegram WebApp init warning:", e);
      }
    </script>
  </head>
  <body class="bg-gray-50 text-gray-900 antialiased min-h-screen">
    <div id="root">
      <!-- Fallback loader while React mounts -->
      <div id="preloader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif; background: #fff; padding: 20px; text-align: center;">
        <div style="font-size: 54px; margin-bottom: 12px; animation: bounce 1.2s infinite;">🛒</div>
        <div style="font-size: 18px; font-weight: 700; color: #E31E24; margin-bottom: 6px;">Korzinka Dostavka</div>
        <div style="font-size: 13px; color: #6b7280;">Yuklanmoqda, iltimos kuting...</div>
        <style>
          @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
